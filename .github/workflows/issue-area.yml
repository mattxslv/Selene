name: Area labels
# A new bug gets the label of the part of Selene it's about (from "Where in Selene?"), so bugs can be filtered by area,
# and a log pasted into the form is folded away.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 0

  fold-log:
    # a log pasted into the bug form becomes a collapsible section, so the report stays readable (nothing is removed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fold the pasted log
        env:
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$BODY" | python3 .github/scripts/fold-log.py > "$RUNNER_TEMP/body.md"
          if [ -s "$RUNNER_TEMP/body.md" ]; then
            gh issue edit "$NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/body.md"
          fi
