name: Notify what a release fixed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (for example v1.5.6)'
        required: true
      dry_run:
        description: 'Preview without posting, labelling or closing'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: release-notify-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const notify = require('./.github/scripts/release-notify.cjs');
            const fixes = require('./.github/release-fixes.json');
            await notify({github, context, tag: process.env.RELEASE_TAG, fixes,
              dryRun: process.env.DRY_RUN === 'true', log: core.info});
