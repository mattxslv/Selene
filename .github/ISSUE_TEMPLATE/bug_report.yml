name: Bug report
description: Something in Selene doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Quicker from Selene itself:** press both sticks in (or Selene settings > Advanced > Report a problem). It sends a picture of the screen, your versions and the logs for you, no account needed.

        Issues are for bugs only. Ideas and requests go to [Discussions > Ideas](https://github.com/mattxslv/Selene/discussions/categories/ideas), questions to [Q&A](https://github.com/mattxslv/Selene/discussions/categories/q-a).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. A screenshot or a short video helps a lot.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where in Selene?
      options:
        - Starting Playnite
        - Spotlight
        - Collection
        - A game's page
        - Store
        - Captures
        - Settings or menu
        - Starting or playing a game
        - Quitting
        - Somewhere else
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Selene (in Playnite's Add-ons list, or the file you downloaded), Playnite (Menu > About) and Windows.
      placeholder: "Selene 1.2.1, Playnite 10.63, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag them in if you can: `%AppData%\Playnite\playnite.log` (portable: in the Playnite folder) and `%TEMP%\selene.log`. Paste `%AppData%` or `%TEMP%` into File Explorer's address bar to open those folders.
